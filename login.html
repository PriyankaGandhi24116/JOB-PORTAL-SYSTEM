<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerHub | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-wrapper">

    <div class="auth-card">

        <a href="index.html" class="auth-logo">
            Career<span>Hub</span>
        </a>

        <h2>Welcome Back</h2>

        <p>
            Login to continue your career journey.
        </p>


        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        onclick="togglePassword('loginPassword','loginEye')">

                        <i class="bi bi-eye" id="loginEye"></i>

                    </button>

                </div>

            </div>


            <div id="loginMessage"></div>


            <button type="submit" class="primary-btn full-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="text-center">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>


        <a href="index.html" class="back-home">
            <i class="bi bi-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
