<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerHub | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-wrapper">

    <div class="auth-card">

        <a href="index.html" class="auth-logo">
            Career<span>Hub</span>
        </a>

        <h2>Create Your Account</h2>

        <p>
            Build your profile and discover better opportunities.
        </p>


        <form id="registerForm">


            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    class="form-control"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    I am a
                </label>

                <select id="registerRole" class="form-select">

                    <option value="Student">
                        Student
                    </option>

                    <option value="Job Seeker">
                        Job Seeker
                    </option>

                    <option value="Recruiter">
                        Recruiter
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create a password"
                        required>

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword','registerEye')">

                        <i class="bi bi-eye" id="registerEye"></i>

                    </button>

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>

            </div>


            <div id="registerMessage"></div>


            <button type="submit" class="primary-btn full-btn">
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="text-center">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html" class="back-home">

            <i class="bi bi-arrow-left"></i>

            Back to Home

        </a>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
